<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingredients - Recipe Management App</title>
    <link rel="stylesheet" href="ingredient-page.css">
</head>
<body>
    <a id="back-link" href="../recipe/recipe-page.html">Back to Recipes</a>
    <h1>Ingredient Management</h1>

    <h2>Ingredients</h2>
    <ul id="ingredient-list" aria-live="polite"></ul>

    <h2>Add an Ingredient</h2>
    <form id="add-ingredient-form" novalidate>
        <label for="add-ingredient-name-input">Ingredient name</label>
        <input id="add-ingredient-name-input" required>
        <button id="add-ingredient-submit-button" type="submit">Add Ingredient</button>
    </form>

    <h2>Delete an Ingredient</h2>
    <form id="delete-ingredient-form" novalidate>
        <label for="delete-ingredient-name-input">Ingredient name</label>
        <input id="delete-ingredient-name-input" required>
        <button id="delete-ingredient-submit-button" type="submit">Delete Ingredient</button>
    </form>

    <script src="ingredient-page.js"></script>
</body>
</html>
