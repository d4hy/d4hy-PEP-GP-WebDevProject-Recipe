<!--
 This file contains the structure for the main recipe management page of the Recipe Management Application.
 It provides interfaces for viewing, adding, updating, deleting, and searching recipes.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes - Recipe Management App</title>
    <link rel="stylesheet" href="recipe-page.css">
</head>
<body>
    <!-- Admin-only navigation -->
    <a id="admin-link" href="../ingredients/ingredient-page.html" hidden>Manage Ingredients</a>
    <a href="../login/login-page.html">Login</a>
    <button id="logout-button" type="button" hidden>Logout</button>

    <h1>Recipes</h1>

    <h2>Search a Recipe</h2>
    <form id="search-form">
        <label for="search-input">Recipe name</label>
        <input id="search-input" type="search">
        <button id="search-button" type="submit">Search</button>
    </form>

    <ul id="recipe-list" aria-live="polite"></ul>

    <h2>Add a Recipe</h2>
    <form id="add-recipe-form" novalidate>
        <div class="form-group">
            <label for="add-recipe-name-input">Recipe name</label>
            <input id="add-recipe-name-input" required>
        </div>
        <div class="form-group">
            <label for="add-recipe-instructions-input">Instructions</label>
            <textarea id="add-recipe-instructions-input" required></textarea>
        </div>
        <button id="add-recipe-submit-input" type="submit">Add Recipe</button>
    </form>

    <h2>Update a Recipe</h2>
    <form id="update-recipe-form" novalidate>
        <div class="form-group">
            <label for="update-recipe-name-input">Recipe name</label>
            <input id="update-recipe-name-input" required>
        </div>
        <div class="form-group">
            <label for="update-recipe-instructions-input">New instructions</label>
            <textarea id="update-recipe-instructions-input" required></textarea>
        </div>
        <button id="update-recipe-submit-input" type="submit">Update Recipe</button>
    </form>

    <h2>Delete a Recipe</h2>
    <form id="delete-recipe-form" novalidate>
        <label for="delete-recipe-name-input">Recipe name</label>
        <input id="delete-recipe-name-input" required>
        <button id="delete-recipe-submit-input" type="submit">Delete Recipe</button>
    </form>

    <script src="recipe-page.js"></script>
</body>
</html>
